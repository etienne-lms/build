image sdcard.img {
	hdimage {
		gpt = "true"
	}

	partition fsbl {
		image = "tf-a-stm32mp157c-ed1.stm32"
		size = 256K
	}

	partition fip {
		image = "fip.bin"
		partition-type-uuid = L
		size = 4M
	}

	partition u-boot-env {
		image = "esp.img"
		partition-type-uuid = c12a7328-f81f-11d2-ba4b-00a0c93ec93b
		size = 4M
	}

	partition bootfs {
		image = "bootfs.ext2"
		partition-type-uuid = L
		size = 32M
		bootable = "yes"
	}

	partition rootfs {
		image = "rootfs.ext2"
		partition-type-uuid = L
		size = 100M
	}
}

CONFIG_BOOTCOMMAND="run bootcmd_usb0 || run bootcmd_stm32mp"
# CONFIG_EFI_SECURE_BOOT is not set
# CONFIG_EFI_VARIABLES_PRESEED is not set
CONFIG_EFI_VAR_BUF_SIZE=16384
CONFIG_EFI_VARIABLE_FILE_STORE=y
# CONFIG_EFI_MM_COMM_TEE is not set
CONFIG_EFI_RUNTIME_UPDATE_CAPSULE=y
CONFIG_EFI_CAPSULE_ON_DISK=y
# CONFIG_EFI_CAPSULE_AUTHENTICATE is not sety
CONFIG_EFI_SET_TIME=y
CONFIG_EFI_GET_TIME=y
# CONFIG_WDT_STM32MP is not set
CONFIG_DM_REGULATOR_SCMI=y
